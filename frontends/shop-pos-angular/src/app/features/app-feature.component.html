<ng-container [ngSwitch]="page">
  <app-dashboard-page *ngSwitchCase="'dashboard'" />
  <app-pos-page *ngSwitchCase="'pos'" />
  <app-brands-page *ngSwitchCase="'brands'" />
  <app-products-page *ngSwitchCase="'products'" />
  <app-stock-page *ngSwitchCase="'stock'" />
  <app-farmers-page *ngSwitchCase="'farmers'" />
  <app-seasons-page *ngSwitchCase="'seasons'" />
  <app-bills-page *ngSwitchCase="'bills'" />
  <app-khata-page *ngSwitchCase="'khata'" />
  <app-settings-page *ngSwitchCase="'settings'" />
</ng-container>
<div class="toast-message" role="status" *ngIf="notice.message()">{{ notice.message() }}</div>
