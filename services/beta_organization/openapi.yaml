  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginRequest:
      properties:
        subdomain:
          type: string
          title: Subdomain
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          title: Password
      type: object
      required:
      - subdomain
      - email
      - password
      title: LoginRequest
    OrgUserCreate:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          minLength: 8
          title: Password
        full_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Full Name
        role_id:
          type: string
          format: uuid
          title: Role Id
      type: object
      required:
      - email
      - password
      - role_id
      title: OrgUserCreate
    OrgUserOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        tenant_id:
          type: string
          format: uuid
          title: Tenant Id
        email:
          type: string
          format: email
          title: Email
        full_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Full Name
        role_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Role Id
        status:
          type: string
          title: Status
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - tenant_id
      - email
      - full_name
      - role_id
      - status
      - created_at
      title: OrgUserOut
    RoleCreate:
      properties:
        name:
          type: string
          maxLength: 40
          minLength: 2
          title: Name
        permission_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Permission Ids
          default: []
      type: object
      required:
      - name
      title: RoleCreate
    RoleOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        tenant_id:
          type: string
          format: uuid
          title: Tenant Id
        name:
          type: string
          title: Name
        permission_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Permission Ids
          default: []
      type: object
      required:
      - id
      - tenant_id
      - name
      title: RoleOut
    SubscriptionCreate:
      properties:
        plan:
          type: string
          title: Plan
        valid_from:
          type: string
          format: date
          title: Valid From
        valid_to:
          type: string
          format: date
          title: Valid To
      type: object
      required:
      - plan
      - valid_from
      - valid_to
      title: SubscriptionCreate
    SubscriptionOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        tenant_id:
          type: string
          format: uuid
          title: Tenant Id
        plan:
          type: string
          title: Plan
        status:
          type: string
          title: Status
        valid_from:
          type: string
          format: date
          title: Valid From
        valid_to:
          type: string
          format: date
          title: Valid To
      type: object
      required:
      - id
      - tenant_id
      - plan
      - status
      - valid_from
      - valid_to
      title: SubscriptionOut
    TenantOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        subdomain:
          anyOf:
          - type: string
          - type: 'null'
          title: Subdomain
        subscription_plan:
          type: string
          title: Subscription Plan
        status:
          type: string
          title: Status
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - name
      - subdomain
      - subscription_plan
      - status
      - created_at
      title: TenantOut
    TenantSignupRequest:
      properties:
        tenant_name:
          type: string
          maxLength: 120
          minLength: 2
          title: Tenant Name
        subdomain:
          type: string
          maxLength: 40
          minLength: 2
          pattern: ^[a-z0-9-]+$
          title: Subdomain
        owner_email:
          type: string
          format: email
          title: Owner Email
        owner_password:
          type: string
          maxLength: 128
          minLength: 8
          title: Owner Password
        owner_full_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner Full Name
      type: object
      required:
      - tenant_name
      - subdomain
      - owner_email
      - owner_password
      title: TenantSignupRequest
    TenantSignupResponse:
      properties:
        tenant:
          $ref: '#/components/schemas/TenantOut'
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
      type: object
      required:
      - tenant
      - access_token
      title: TenantSignupResponse
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        expires_in:
          type: integer
          title: Expires In
      type: object
      required:
      - access_token
      - expires_in
      title: TokenResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
