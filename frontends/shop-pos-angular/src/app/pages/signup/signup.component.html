<section class="auth-layout">
  <aside class="auth-photo">
    <app-logo variant="dark"></app-logo>

    <div class="auth-photo-content">
      <span>FERTI+</span>
      <h1>Your shop,<br>digitised.</h1>
      <p>
        Start managing stock, billing and farmer credit with one simple account.
      </p>
    </div>
  </aside>

  <main class="auth-panel">
    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>

      <span class="eyebrow">FREE SHOP OWNER ACCOUNT</span>

      <h1>Create your account</h1>

      <p class="lead">
        One owner account for one shop. Get started today.
      </p>

      <div class="alert alert-danger" *ngIf="error" role="alert">
        {{ error }}
      </div>

      <div class="form-grid">

        <!-- Owner Name -->
        <label>
          Owner name

          <input class="form-control" type="text" formControlName="ownerName" autocomplete="name"
            placeholder="Enter owner name" />

          <small class="error" *ngIf="bad('ownerName')">
            <ng-container *ngIf="form.controls.ownerName.hasError('required')">
              Owner name is required.
            </ng-container>
            <ng-container *ngIf="form.controls.ownerName.hasError('minlength')">
              Enter at least 2 characters.
            </ng-container>
          </small>
        </label>

        <!-- Shop Name -->
        <label>
          Shop name

          <input class="form-control" type="text" formControlName="shopName" autocomplete="organization"
            placeholder="Enter shop name" />

          <small class="error" *ngIf="bad('shopName')">
            <ng-container *ngIf="form.controls.shopName.hasError('required')">
              Shop name is required.
            </ng-container>
            <ng-container *ngIf="form.controls.shopName.hasError('minlength')">
              Enter at least 2 characters.
            </ng-container>
          </small>
        </label>

        <!-- Email -->
        <label>
          Email address

          <input class="form-control" type="email" formControlName="email" autocomplete="email"
            placeholder="Enter email address" />

          <small class="error" *ngIf="bad('email')">
            <ng-container *ngIf="form.controls.email.hasError('required')">
              Email address is required.
            </ng-container>
            <ng-container *ngIf="form.controls.email.hasError('email')">
              Enter a valid email address.
            </ng-container>
          </small>
        </label>

        <!-- Mobile Number -->
        <label>
          Mobile number

          <div class="phone-input">
            <span>+91</span>

            <input class="form-control" type="tel" inputmode="numeric" maxlength="10" minlength="10"
              formControlName="phone" autocomplete="tel-national" placeholder="Enter 10-digit mobile number"
              (input)="onPhoneInput()" />
          </div>

          <small class="error" *ngIf="bad('phone')">
            <ng-container *ngIf="form.controls.phone.hasError('required')">
              Mobile number is required.
            </ng-container>
            <ng-container *ngIf="form.controls.phone.hasError('minlength') || form.controls.phone.hasError('maxlength')">
              Enter exactly 10 digits.
            </ng-container>
          </small>
        </label>

        <!-- Password -->
        <label>
          Password

          <div class="password">
            <input class="form-control" [type]="showPassword ? 'text' : 'password'" formControlName="password"
              autocomplete="new-password" placeholder="Create password" />

            <button type="button" (click)="showPassword = !showPassword">
              {{ showPassword ? 'Hide' : 'Show' }}
            </button>
          </div>

          <small class="error" *ngIf="bad('password')">
            <ng-container *ngIf="form.controls.password.hasError('required')">
              Password is required.
            </ng-container>
            <ng-container *ngIf="form.controls.password.hasError('minlength')">
              Use at least 8 characters.
            </ng-container>
          </small>
        </label>

        <!-- Confirm Password -->
        <label>
          Confirm password

          <input class="form-control" type="password" formControlName="confirm" autocomplete="new-password"
            placeholder="Confirm password" />

          <small class="error" *ngIf="form.controls.confirm.touched">
            <ng-container *ngIf="form.controls.confirm.hasError('required')">
              Please confirm your password.
            </ng-container>
            <ng-container *ngIf="form.errors?.['mismatch']">
              Passwords do not match.
            </ng-container>
          </small>
        </label>

      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-primary primary-action" [disabled]="loading">
        {{ loading ? 'Creating account...' : 'Create account' }}
      </button>

      <!-- Sign In -->
      <p class="switch">
        Already have an account?
        <a routerLink="/signin">Sign in</a>
      </p>

    </form>
  </main>
</section>
