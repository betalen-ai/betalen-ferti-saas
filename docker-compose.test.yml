services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: betalen_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

  beta_billing_tests:
    build: ./services/beta_billing
    command: pytest tests/ -v --cov=app
    environment:
      DATABASE_URL: postgresql+asyncpg://test:test@postgres-test:5432/betalen_test
    depends_on:
      - postgres-test

  beta_organization_tests:
    build: ./services/beta_organization
    command: pytest tests/ -v --cov=app
    environment:
      DATABASE_URL: postgresql+asyncpg://test:test@postgres-test:5432/betalen_test
    depends_on:
      - postgres-test

  beta_inventory_tests:
    build: ./services/beta_inventory
    command: pytest tests/ -v --cov=app
    environment:
      DATABASE_URL: postgresql+asyncpg://test:test@postgres-test:5432/betalen_test
    depends_on:
      - postgres-test

  beta_email_tests:
    build: ./services/beta_email
    command: pytest tests/ -v --cov=app
    environment:
      DATABASE_URL: postgresql+asyncpg://test:test@postgres-test:5432/betalen_test
      EMAIL_PROVIDER: console
    depends_on:
      - postgres-test